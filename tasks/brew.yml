- name: Check if Homebrew is installed
  ansible.builtin.command: brew --version
  register: homebrew_check
  changed_when: false
  failed_when: false

- name: Install Homebrew if necessary
  # No module installs Homebrew itself; the official installer is a curl pipe.
  ansible.builtin.command: curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
  when: homebrew_check.rc != 0
  changed_when: true
  # noqa: command-instead-of-module

- name: Batch install with brew bundle
  ansible.builtin.command: brew bundle --file={{ playbook_dir }}/Brewfile
  changed_when: true
  failed_when: false
