- name: Configure macOS workstation
  hosts: localhost
  vars:
    source_key: "{{ playbook_dir }}/.ssh/id_rsa"
    dest_key: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"
    zsh_custom: "{{ lookup('env', 'HOME') }}/.oh-my-zsh/custom"
    my_repo: "https://github.com/vup815"
    email: vup815@gmail.com
    username: samuel.tseng

  tasks:
    - name: Install Homebrew packages
      ansible.builtin.import_tasks: tasks/brew.yml
    - name: Configure zsh and oh-my-zsh
      ansible.builtin.import_tasks: tasks/zsh.yml
    - name: Install and configure neovim
      ansible.builtin.import_tasks: tasks/neovim.yml
    - name: Link dotfiles into home directory
      ansible.builtin.import_tasks: tasks/symlink.yml
    - name: Configure git identity
      ansible.builtin.import_tasks: tasks/git.yml
    - name: Install ssh keys
      ansible.builtin.import_tasks: tasks/ssh.yml
